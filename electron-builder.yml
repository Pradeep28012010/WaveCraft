appId: com.wavecraft.pro
productName: WaveCraft Pro
copyright: Copyright © 2026 WaveCraft

directories:
  output: dist-electron

files:
  - dist/**/*
  - electron/**/*
  - public/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: WaveCraft Pro
  artifactName: WaveCraft-Pro-Setup.${ext}
  uninstallDisplayName: WaveCraft Pro
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
